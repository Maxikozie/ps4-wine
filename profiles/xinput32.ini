; xinput32.exe, the sample program of milestone l1 (docs/ps4/HANDOFF-i.md "l1"): the DS4 as XInput
; controller 0 through xinput1_3.dll and xinput1_3.prx. scripts/ps4/prefix.sh --extras builds the program
; into C:\xinput32.exe and uploads this file to /data/ps4-wine/profiles/xinput32.ini (the prefix and
; runtime names below are not used on the PS4).
[application]
id = xinput32
name = XInput sample (milestone l1)
executable = C:\xinput32.exe
working_directory = C:\
prefix = default
runtime = wine-wow64
architecture = PE32
graphics = GDI

[input]
; The title feeds the DS4 into Wine's pad slot only in this mode (no key or mouse bindings).
mode = xinput

[runtime]
; As g1n chose for 32-bit programs (vtmb.ini): the hardware WoW64 CPU.
cpu = native
