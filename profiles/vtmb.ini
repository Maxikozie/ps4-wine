; Vampire: The Masquerade - Bloodlines, GOG's "Bloodlines - Unofficial Patch" (UP 11.5): milestone g
; (docs/ps4/HANDOFF-g.md). scripts/ps4/game.sh uploads it to /data/ps4-wine/profiles/vtmb.ini and the game to
; C:\VTMB in the one prefix (the prefix and runtime names below are not used on the PS4). GOG's play task is
; vampire.exe -game Unofficial_Patch; Loader.exe cannot run (it starts the game by CreateProcess).
[application]
id = vtmb
name = Vampire: The Masquerade - Bloodlines (UP 11.5)
executable = C:\VTMB\Vampire.exe
working_directory = C:\VTMB
arguments = -game Unofficial_Patch
dll_overrides = d3d9=n
prefix = default
runtime = wine-wow64
architecture = PE32
graphics = DXVK

[display]
desktop = 1920x1080
show_fps = true

[input]
; The DS4 bindings when no USB keyboard and mouse are used: /data/ps4-wine/input/vtmb.input.
preset = vtmb

[runtime]
; g1n decides: native when wow32.exe's SEH, x87/SSE2 and thread checks pass on it, else translator.
cpu = native
