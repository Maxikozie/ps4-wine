; Psychonauts (GOG 2.2.0.13, Psychonauts.exe 1.1.603.0): milestones k-n (docs/ps4/HANDOFF-i.md).
; scripts/ps4/game.sh --game psychonauts uploads it to /data/ps4-wine/profiles/psychonauts.ini and the game to
; C:\Psychonauts in the one prefix (the prefix and runtime names below are not used on the PS4). The game reads
; its INIs and writes its saves relative to its working directory (_getcwd), so that must be the game folder.
; No arguments: GOG's play task starts Psychonauts.exe bare.
[application]
id = psychonauts
name = Psychonauts (GOG 2.2.0.13)
executable = C:\Psychonauts\Psychonauts.exe
working_directory = C:\Psychonauts
dll_overrides = d3d9=n
prefix = default
runtime = wine-wow64
architecture = PE32
graphics = DXVK

[display]
desktop = 1920x1080
; DXVK's HUD comes from [debug] below (FPS and the frame-time graph); show_fps would set DXVK_HUD=fps and
; then refuse a DXVK_HUD debug env.
show_fps = false

[input]
; Milestone l: the DS4 as the game's XInput controller 0 (the game's own pad bindings); the preset
; (/data/ps4-wine/input/psychonauts.input) adds Enter on the touchpad's left half for the name screen.
; k's keys are kept in profiles/input/psychonauts-keys.input (S5's fallback).
mode = xinput
preset = psychonauts

[debug]
; DXVK 2.6.2 has no profile for Psychonauts; profiles/psychonauts.dxvk.conf caps it at 60 fps (its physics
; break above) and game.sh uploads it as C:\Psychonauts\dxvk.conf. Forward slashes: env values take no
; backslash, and the PE side's file calls accept '/'. No winedebug line: it would replace the title's
; channels (+loaddll among them), which k's launch reads.
env = DXVK_CONFIG_FILE=C:/Psychonauts/dxvk.conf
; DXVK 2.6.2's HUD: FPS and the frame-time graph (each hitch shows); the 1% low is in the title's log
; (PW_MS step k fps ... fps_low_1pct=, every 10 s).
env = DXVK_HUD=fps,frametimes

[runtime]
; As g1n chose for 32-bit games (vtmb.ini): the hardware WoW64 CPU.
cpu = native
; Measured on the laptop in milestone j: the saves and the bindings INI land in C:\Psychonauts\Profiles\Profile 1\
; (nothing under drive_c/users). Milestone n watches this directory.
saves = C:\Psychonauts\Profiles
