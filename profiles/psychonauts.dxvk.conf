# Psychonauts (GOG 2.2.0.13) under DXVK 2.6.2's 32-bit d3d9 (docs/ps4/HANDOFF-i.md, "The frame rate"): DXVK has
# no profile for it. The game's physics break above 60 fps (doors, trampolines, poles), so the frame rate is
# capped here and does not depend on the game's VSync reaching the swapchain. Used by host-game.sh on the
# laptop (milestone j) and uploaded by game.sh as C:\Psychonauts\dxvk.conf (k-n); DXVK_CONFIG_FILE names it.
d3d9.maxFrameRate = 60
